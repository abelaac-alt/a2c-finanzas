<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2C Finanzas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header-principal">
            <h1>Control Financiero</h1>
        </header>

        <main class="content">
            <!-- Tarjeta Principal de Balance -->
            <section class="card-financiera balance-card">
                <h2>Balance Total</h2>
                <div class="balance-monto" id="total-balance">€ 0.00</div>
            </section>

            <!-- Tarjeta de Últimos Movimientos -->
            <section class="card-financiera">
                <h2>Últimos Movimientos</h2>
                <ul class="lista-movimientos" id="movimientos-list">
                    <!-- Los elementos se insertarán vía JS -->
                </ul>
            </section>
        </main>

        <!-- Menú inferior fijo (estilo red social) -->
        <nav class="bottom-nav">
            <button class="nav-item active"><span class="icon">🏠</span>Inicio</button>
            <button class="nav-item"><span class="icon">📊</span>Gastos</button>
            <button class="nav-item action-btn"><span class="icon">+</span></button>
            <button class="nav-item"><span class="icon">👥</span>Amigos</button>
            <button class="nav-item"><span class="icon">⚙️</span>Ajustes</button>
        </nav>
    </div>
    
    <!-- Scripts -->
    <script src="app.bundle.js"></script>
    <script src="app.js"></script>
</body>
</html>
